<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDEN Grammar Lab · 중3 Lesson 7</title>
<style>
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#18202f; --sub:#5b6374; --mute:#8d93a0;
  --line:#e3e0d8; --line2:#efede7;
  --navy:#16213a; --navy2:#24345a; --accent:#2b59c3; --accent-d:#1e429a; --accent-soft:#e9eefb;
  --gold:#c49a3c; --gold-soft:#f7efdc;
  --ok:#1d8656; --ok-soft:#e6f4ec; --no:#c4413a; --no-soft:#fbeceb;
  --font:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
button,input{font-family:var(--font);font-size:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 56px}
.hidden{display:none!important}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:rgba(245,243,238,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.mark{width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.3px}
.brand span{font-size:12px;color:var(--mute);display:block;line-height:1.2}
.hdr-actions{display:flex;gap:6px}
.lnk{padding:7px 12px;border-radius:8px;font-size:13px;color:var(--sub);font-weight:700}
.lnk:hover{background:#ebe8e1;color:var(--ink)}

/* buttons */
.btn{padding:12px 20px;border-radius:10px;font-weight:700;font-size:15px;transition:background .15s,transform .08s}
.btn:active{transform:scale(.98)}
.btn-pri{background:var(--navy);color:#fff}
.btn-pri:hover{background:var(--navy2)}
.btn-sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-sec:hover{border-color:#cfcbc1}
.btn[disabled]{opacity:.4;cursor:default}

/* hero */
.hero{margin-top:20px;background:var(--navy);color:#f4f1ea;border-radius:18px;padding:28px 26px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 30px rgba(255,255,255,.025),0 0 0 60px rgba(255,255,255,.02)}
.eyebrow{font-size:12px;letter-spacing:.5px;color:#a9b4cc;font-weight:700}
.hero h1{font-size:28px;font-weight:800;letter-spacing:-.8px;margin:6px 0 12px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.18);color:#dfe5f2}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1b1b1b;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
.kpi{background:#fff;padding:14px 16px}
.kpi .k{font-size:12px;color:var(--mute);font-weight:700}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.kpi .v small{font-size:13px;color:var(--mute);font-weight:700;margin-left:2px}

/* stage list */
.sec-title{font-size:13px;color:var(--mute);font-weight:800;margin:26px 2px 10px;letter-spacing:.3px}
.stages{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.st{width:100%;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;padding:16px 18px;text-align:left;border-bottom:1px solid var(--line2);transition:background .12s}
.st:last-child{border-bottom:none}
.st:hover{background:#faf9f6}
.st .no{font-size:22px;font-weight:800;color:#c9c5bb;letter-spacing:-.5px}
.st.done .no{color:var(--accent)}
.st h3{font-size:16px;font-weight:800;letter-spacing:-.3px}
.st p{font-size:13px;color:var(--sub);line-height:1.5;margin-top:1px}
.st .rt{text-align:right;min-width:82px}
.st .pct{font-size:13px;font-weight:800;color:var(--ink)}
.st .pct.none{color:var(--mute);font-weight:700}
.mbar{height:4px;background:var(--line2);border-radius:99px;overflow:hidden;margin-top:6px;width:82px;margin-left:auto}
.mbar div{height:100%;background:var(--accent);border-radius:99px}
.wrong-row{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.wrong-row b{font-size:15px}
.wrong-row span{font-size:13px;color:var(--sub);display:block}

/* page */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:24px 0 14px;flex-wrap:wrap}
.phead .eyebrow{color:var(--mute)}
.phead h2{font-size:22px;font-weight:800;letter-spacing:-.6px;line-height:1.3}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--sub)}
.stat b{color:var(--ink)}
.track{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.track div{height:100%;background:var(--accent);transition:width .3s}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.qno{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--accent)}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--line2);color:var(--sub)}
.tag.gold{background:var(--gold-soft);color:#8a6a1f}
.qtext{font-size:17px;font-weight:700;line-height:1.6;margin:10px 0 14px;white-space:pre-line;letter-spacing:-.3px}
.qbox{background:#faf9f6;border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.8;margin-bottom:16px;white-space:pre-line}
.qbox u,.opt u{text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;text-align:left;padding:13px 15px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;line-height:1.55;white-space:pre-line;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:#bfc8dc;background:#fbfcfe}
.opt .m{font-weight:800;color:var(--mute);min-width:16px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .m{color:var(--accent)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .m{color:var(--ok)}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.opt.wrong .m{color:var(--no)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:5px}
.fld .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fld .row .fix{font-size:15px;color:var(--sub)}
.fld input{flex:1;min-width:0;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;outline:none;transition:border-color .12s}
.fld input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld input.ok{border-color:var(--ok);background:var(--ok-soft)}
.fld input.no{border-color:var(--no);background:var(--no-soft)}
.fld input.self{border-color:var(--gold);background:var(--gold-soft)}
.hintline{font-size:12px;color:var(--mute);margin-top:4px}
.fb{margin-top:16px;border-radius:12px;padding:15px 16px;font-size:14px;line-height:1.75;border:1px solid}
.fb.good{background:var(--ok-soft);border-color:#bfe3cf}
.fb.bad{background:var(--no-soft);border-color:#f0c9c6}
.fb .h{font-weight:800;font-size:15px;margin-bottom:3px}
.fb.good .h{color:var(--ok)} .fb.bad .h{color:var(--no)}
.fb .a{font-weight:800}
.fb .exp{color:var(--sub);margin-top:4px}
.fb .self{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(0,0,0,.12)}
.acts{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}
.acts .r{display:flex;gap:8px;margin-left:auto}
.hintbox{margin-top:12px;background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.75;color:#24345a}

/* concept */
.cpt h3{font-size:21px;font-weight:800;letter-spacing:-.6px;margin:8px 0 12px}
.cpt p{margin-bottom:10px}
.cpt h4{font-size:14px;font-weight:800;margin:14px 0 6px}
.ex{background:#faf9f6;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0 12px;font-size:14.5px;line-height:1.85}
.ex .lbl{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px;background:var(--line2);color:var(--sub);margin-right:6px;vertical-align:1px}
.ex .lbl.acc{background:var(--navy);color:#fff}
.ex s{color:var(--mute)}
.ok-t{color:var(--ok);font-weight:800}.no-t{color:var(--no);font-weight:800}
.hl{color:var(--accent);font-weight:800}
.note{font-size:14px;color:var(--sub);background:var(--gold-soft);border-radius:10px;padding:10px 13px}
.steps{list-style:none;counter-reset:s;margin:6px 0 12px}
.steps li{counter-increment:s;position:relative;padding:10px 12px 10px 46px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.steps li:before{content:counter(s);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.steps li b{display:block;font-size:14.5px}
.steps li span{font-size:13px;color:var(--sub)}
.tw{overflow-x:auto;margin:6px 0 12px;border:1px solid var(--line);border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
table.t th{background:#f3f1ec;text-align:left;font-weight:800;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.6}
table.t tr:last-child td{border-bottom:none}
table.t td:first-child{font-weight:800;white-space:nowrap}
.chk{margin-top:16px;border-top:1px solid var(--line2);padding-top:14px}
.chk .q{font-size:14px;font-weight:800;margin-bottom:8px}
.chk .q:before{content:"CHECK";font-size:10px;font-weight:800;color:#fff;background:var(--accent);padding:2px 6px;border-radius:4px;margin-right:8px;vertical-align:2px}
.chk .row{display:flex;gap:6px;flex-wrap:wrap}
.chk button{padding:8px 13px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:700;background:#fff}
.chk button.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.chk button.no{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.chk .msg{font-size:13px;margin-top:6px;color:var(--sub)}
.dots{display:flex;gap:4px;justify-content:center;margin:16px 0 0}
.dots span{width:6px;height:6px;border-radius:99px;background:#d6d2c8;transition:width .2s}
.dots span.on{width:20px;background:var(--navy)}

/* -ing / as choosers */
.sent{font-size:20px;line-height:1.7;text-align:center;padding:26px 8px 22px;letter-spacing:-.3px}
.sent mark{background:none;color:var(--accent);font-weight:800;border-bottom:2px solid var(--accent);padding:0 1px}
.choices{display:grid;gap:8px}
.choices.c3{grid-template-columns:repeat(3,1fr)}
.choices.c5{grid-template-columns:repeat(5,1fr)}
.ch{padding:14px 6px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:15px;transition:border-color .12s,background .12s}
.ch small{display:block;font-size:11px;font-weight:600;color:var(--mute);margin-top:2px}
.ch:hover:not([disabled]){border-color:var(--navy)}
.ch.correct{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.ch.wrong{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.ch[disabled]{cursor:default}

/* speed */
.speed-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.timebar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.timebar div{height:100%;background:var(--navy);transition:width 1s linear}
.timebar.warn div{background:var(--no)}
.tnum{font-weight:800;font-size:15px;min-width:38px;text-align:right}
.speed-card{position:relative}
.flash-ok{animation:fok .35s}.flash-no{animation:fno .35s}
@keyframes fok{0%{box-shadow:0 0 0 0 rgba(29,134,86,.45)}100%{box-shadow:0 0 0 14px rgba(29,134,86,0)}}
@keyframes fno{0%{box-shadow:0 0 0 0 rgba(196,65,58,.45)}100%{box-shadow:0 0 0 14px rgba(196,65,58,0)}}
.last{min-height:22px;text-align:center;font-size:13px;margin-top:12px;color:var(--sub)}
.review{margin-top:14px;border-top:1px solid var(--line2)}
.review div{padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px}
.review div span{display:inline-block;font-size:12px;font-weight:800;color:var(--ok);margin-left:6px}

/* blocks */
.zone{min-height:62px;border:1px dashed #c8c3b7;border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin-bottom:14px;background:#fcfbf9}
.zone .ph{color:var(--mute);font-size:13px;padding:8px 4px}
.pool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.blk{padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:15px;box-shadow:0 1px 0 var(--line)}
.blk:hover{border-color:var(--navy)}
.blk.used{visibility:hidden}
.zone .blk{background:var(--navy);border-color:var(--navy);color:#fff}

/* exam */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--sub)}
.filters button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-bottom:14px}
.grid button{height:32px;border-radius:6px;font-size:11px;font-weight:800;background:#fff;border:1px solid var(--line);color:var(--mute)}
.grid button.ok{background:var(--ok-soft);border-color:#a9d8bf;color:var(--ok)}
.grid button.no{background:var(--no-soft);border-color:#ecbbb7;color:var(--no)}
.grid button.cur{outline:2px solid var(--navy);outline-offset:1px;color:var(--ink)}

/* result */
.res{text-align:center;padding:36px 22px}
.res .big{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1}
.res .big small{font-size:20px;color:var(--mute);letter-spacing:0}
.res h3{font-size:19px;font-weight:800;margin:12px 0 4px}
.res p{color:var(--sub);font-size:14px}
.res .acts{justify-content:center}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--gold-soft);color:#8a6a1f;margin-top:10px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;z-index:60;animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.streak{position:fixed;right:16px;top:70px;background:var(--gold);color:#1b1b1b;font-weight:800;font-size:13px;padding:6px 12px;border-radius:99px;z-index:60;animation:tin .2s}

@media (max-width:600px){
  .hero{padding:22px 18px}
  .hero h1{font-size:23px}
  .kpi{padding:12px}
  .kpi .v{font-size:20px}
  .card{padding:18px 16px}
  .qtext{font-size:16px}
  .sent{font-size:17px;padding:18px 2px}
  .choices.c5{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(10,1fr)}
  .st{grid-template-columns:38px 1fr auto;padding:14px}
  .st .no{font-size:18px}
  .st .rt{min-width:64px}.mbar{width:64px}
  .brand span{display:none}
}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-in">
  <div class="brand" onclick="home()"><div class="mark">E</div><div><b>EDEN Grammar Lab</b><span>중3 · Lesson 7 · Technology in Our Lives</span></div></div>
  <div class="hdr-actions"><button class="lnk" onclick="home()">홈</button><button class="lnk" onclick="resetAll()">기록 초기화</button></div>
</div></header>
<main class="wrap" id="app"></main>

<script>
/* =========================================================
   저장 (이 기기에만 저장)
   ========================================================= */
const KEY='edenM3L7';
const store={
  get(k,d){try{const v=localStorage.getItem(KEY+'_'+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(KEY+'_'+k,JSON.stringify(v));}catch(e){}}
};
let prog=store.get('prog',{best:{},exam:{},wrong:[]});
const save=()=>store.set('prog',prog);

/* =========================================================
   01 개념 노트
   ========================================================= */
const CONCEPTS=[
{tag:'분사구문 · 개념',title:'분사구문이란?',body:`
<p>시간·이유·조건·양보·동시동작을 나타내는 <b>부사절(접속사 + 주어 + 동사)</b>에서 접속사와 주어를 빼고, 동사를 <b>분사(동사원형 + -ing)</b>로 바꿔 짧게 줄인 구문입니다.</p>
<div class="ex"><span class="lbl">부사절</span>As experts use various methods, they analyze big data.<br><span class="lbl acc">분사구문</span><b class="hl">Using various methods</b>, experts analyze big data.</div>
<p class="note">왜 쓸까? 같은 주어가 반복되거나 문장이 길어질 때, 더 간결하고 세련되게 전달하기 위해 씁니다.</p>`,
check:{q:'분사구문은 원래 어떤 절을 줄인 것일까?',o:['명사절','형용사절','부사절'],a:2}},

{tag:'분사구문 · 공식',title:'부사절 → 분사구문 3단계',body:`
<ol class="steps">
<li><b>접속사 생략</b><span>의미를 분명히 하고 싶으면 남겨 두기도 합니다. (While walking…)</span></li>
<li><b>주어 확인 후 생략</b><span>주절의 주어와 같을 때만 생략합니다. 다르면 분사 앞에 그대로 둡니다.</span></li>
<li><b>동사 → 동사원형 + -ing</b><span>시제가 같으면 -ing로 바꿉니다. 수동태(being + p.p.)는 being을 주로 생략합니다.</span></li></ol>
<div class="ex">While she ate a sandwich, she waited for the train.<br>→ <s>While</s> <s>she</s> ate → <b class="hl">Eating a sandwich</b>, she waited for the train.</div>`,
check:{q:'Because Tom was tired, he stayed home. → ___ tired, Tom stayed home.',o:['Be','Being','Was'],a:1}},

{tag:'분사구문 · 의미',title:'문맥으로 읽는 5가지 의미',body:`
<div class="tw"><table class="t"><tr><th>의미</th><th>해석</th><th>원래 접속사</th><th>예문</th></tr>
<tr><td>동시동작</td><td>~하면서, ~한 채로</td><td>while, as</td><td>Eating a sandwich, she waited for the train.</td></tr>
<tr><td>연속동작</td><td>그리고 ~하다</td><td>and</td><td>Big data is improving players' performance, making sports more exciting.</td></tr>
<tr><td>시간</td><td>~할 때, ~한 후에</td><td>when, while, after</td><td>Walking along the street, I saw a man with five dogs.</td></tr>

{tag:'분사구문 · 시험 포인트',title:'부정어 위치와 주어 일치',body:`

{tag:'접속사 as · 의미',title:'접속사 as의 4가지 의미',body:`
<div class="tw"><table class="t"><tr><th>의미</th><th>해석</th><th>식별 힌트</th><th>예문</th></tr>
<tr><td>비례</td><td>~함에 따라, ~할수록</td><td>비교급, develop · grow · get · become</td><td>As information and communication technology develops, the amount of data we have is getting much greater than before.</td></tr>
<tr><td>이유</td><td>~ 때문에</td><td>= because, since</td><td>As it was late at night, we went back home.</td></tr>
<tr><td>시간</td><td>~할 때, ~하는 동안</td><td>= when, while</td><td>She called me as I was leaving the house.</td></tr>
<tr><td>양태</td><td>~하는 대로, ~하듯이</td><td>방식·예측과의 일치</td><td>Health professionals can now forecast a disease just as weather experts forecast the weather.</td></tr></table></div>`,
check:{q:'As the weather forecaster predicted, it rained all day. 의 as는?',o:['이유','비례','양태'],a:2}},

{tag:'접속사 as · 구별',title:'as 뒤에 무엇이 오는가',body:`
<h4>접속사 as + 주어 + 동사</h4>
<div class="ex">As spring comes, it gets warmer and warmer.</div>
<h4>전치사 as + 명사 → ~로서, ~처럼</h4>
<div class="ex">He works <b class="hl">as a data scientist</b>. (데이터 과학자로서)<br>We chose the Greek goddess <b class="hl">as its symbol</b>.</div>
<h4>as ~ as 원급비교 → ~만큼 …한</h4>
<div class="ex">Tom runs <b class="hl">as fast as</b> Mike.<br>The situation is not so bad as you think.</div>`,
check:{q:'He works as a data scientist. 의 as는?',o:['접속사','전치사','원급비교'],a:1}},

{tag:'Word Power',title:'-ly와 -ful',body:`
<h4>형용사 + -ly = 부사 (~하게)</h4>
<div class="ex">wise → <b class="hl">wisely</b> &nbsp;·&nbsp; regular → regularly &nbsp;·&nbsp; easy → easily &nbsp;·&nbsp; general → generally &nbsp;·&nbsp; possible → possibly<br><small>본문: If this kind of data is analyzed <b>wisely</b>, …</small></div>
<h4>명사 + -ful = 형용사 (~이 가득한)</h4>
<div class="ex">meaning → <b class="hl">meaningful</b> &nbsp;·&nbsp; use → useful &nbsp;·&nbsp; help → helpful &nbsp;·&nbsp; care → careful<br><small>본문: draw <b>meaningful</b> results from it</small></div>
<p class="note">함정: friend(명사) + -ly = friendly는 부사가 아니라 <b>형용사</b>(다정한)입니다.</p>`,
check:{q:'If this data is analyzed ___ (wise), we can forecast diseases.',o:['wise','wisely','wiseful'],a:1}},

{tag:'Useful Expressions',title:'본문 필수 표현',body:`
<h4>focus on ~에 집중하다</h4>
<div class="ex">Police can prevent further crime by <b class="hl">focusing on</b> the areas and times this map predicts.</div>
<h4>play a(n) important role (in) (~에서) 중요한 역할을 하다</h4>
<div class="ex">Experts agree that big data will <b class="hl">play a more and more important role</b> in our lives.</div>
<h4>be likely to + 동사원형 ~할 가능성이 있다</h4>
<div class="ex">Police can predict where and when crime is most <b class="hl">likely to happen</b>.<br>They are likely to lose the game because they didn't practice much.</div>`,
check:{q:'They are likely ___ the game.',o:['losing','to lose','lost'],a:1}}
];

const app=document.getElementById('app');
const $=s=>app.querySelector(s);
const $$=s=>[...app.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich=s=>esc(s).replace(/&lt;(\/?)u&gt;/g,'<$1u>');
const plain=s=>String(s).replace(/<\/?u>/g,'');
const norm=s=>String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.,!?"“”'’:;()\[\]→➔·]/g,' ').replace(/\s+/g,'').trim();
const MARK='①②③④⑤';
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1300);}
function streak(n){if(n<3)return;const d=document.createElement('div');d.className='streak';d.textContent=n+' 연속 정답';document.body.appendChild(d);setTimeout(()=>d.remove(),1100);}
function setBest(id,score,max){const r=max?score/max:0;const o=prog.best[id];if(!o||r>=o.r)prog.best[id]={score,max,r};save();}
function checkField(f,val){
  if(f.self) return null;
  if(f.kw) return f.kw.some(k=>String(val).includes(k));
  return f.acc.some(a=>norm(a)===norm(val));
}
function fieldAns(f){return f.ans||(f.acc?f.acc[0]:f.self);}
function head(eyebrow,title,stats){return `<div class="phead"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2></div><div class="stats">${stats||''}</div></div>`;}
function scrollTop(){try{window.scrollTo({top:0,behavior:'instant'});}catch(e){window.scrollTo(0,0);}}

const STAGES=[
 {id:'concept',t:'개념 노트',d:'분사구문 · 접속사 as · -ly/-ful · 필수 표현 10장 + 확인 문제'},
 {id:'train',t:'변환 트레이닝',d:'부사절 ↔ 분사구문 직접 쓰기 · 오류 수정 (Easy / Basic / Challenging)'},
 {id:'ing',t:'-ing 판별',d:'동명사 · 현재분사 · 분사구문 구별하기'},
 {id:'as',t:'as 분류 스피드',d:'60초 안에 비례 · 이유 · 시간 · 양태 · 전치사 분류'},
 {id:'block',t:'문장 조립',d:'단어 블록으로 교과서 핵심 문장 완성'},

];
function stagePct(id){
  if(id==='exam'){const ok=Object.values(prog.exam).filter(v=>v==='ok').length;return Object.keys(prog.exam).length?ok/50:null;}
  if(id==='train'){const ks=Object.keys(TRAIN).map(k=>prog.best['train_'+k]).filter(Boolean);return ks.length?ks.reduce((s,b)=>s+b.r,0)/3:null;}
  const b=prog.best[id];return b?b.r:null;
}

function go(id){({concept:concept,train:trainMenu,ing:ingGame,as:asIntro,block:blockGame,exam:()=>exam()})[id]();}
function resetAll(){if(!confirm('모든 학습 기록과 오답노트를 지울까요?'))return;prog={best:{},exam:{},wrong:[]};save();home();toast('기록을 초기화했습니다');}

function result(eyebrow,score,max,msg,again,extra){
  const pct=Math.round(score/Math.max(max,1)*100);
  const line=pct>=90?'완벽합니다. 시험장에서도 그대로!':pct>=70?'좋습니다. 틀린 부분만 다시 보면 됩니다.':pct>=40?'개념 노트를 한 번 더 보고 다시 도전해 보세요.':'개념 노트부터 차근차근 다시 시작해 봅시다.';
  app.innerHTML=head(eyebrow,'결과')+`<div class="card res">
    <div class="big">${score}<small> / ${max}</small></div>
    <h3>${msg||'정답률 '+pct+'%'}</h3><p>${line}</p>${extra||''}
    <div class="acts"><button class="btn btn-sec" id="again">다시 하기</button><button class="btn btn-pri" onclick="home()">학습 경로로</button></div></div>`;
  $('#again').onclick=again;scrollTop();
}

   01 개념 노트
   ========================================================= */
function concept(){
  let i=0,got=0;const tried=new Set();
  const draw=()=>{
    const c=CONCEPTS[i];
    app.innerHTML=head('STEP 01 · 개념 노트',c.title,`<span class="stat"><b>${i+1}</b> / ${CONCEPTS.length}</span>`)+
    `<div class="track"><div style="width:${(i+1)/CONCEPTS.length*100}%"></div></div>
    <div class="card cpt"><span class="tag">${c.tag}</span><div style="margin-top:10px">${c.body}</div>
    ${c.check?`<div class="chk"><div class="q">${esc(c.check.q)}</div><div class="row">${c.check.o.map((o,k)=>`<button data-k="${k}">${esc(o)}</button>`).join('')}</div><div class="msg" id="cm"></div></div>`:''}
    </div>
    <div class="dots">${CONCEPTS.map((_,k)=>`<span class="${k===i?'on':''}"></span>`).join('')}</div>
    <div class="acts"><button class="btn btn-sec" id="pv" ${i?'':'disabled'}>이전</button><div class="r"><button class="btn btn-pri" id="nx">${i===CONCEPTS.length-1?'완료':'다음'}</button></div></div>`;
    $$('.chk button').forEach(b=>b.onclick=()=>{
      if(tried.has(i))return;tried.add(i);
      const k=+b.dataset.k,ok=k===c.check.a;if(ok)got++;
      $$('.chk button').forEach((x,j)=>{if(j===c.check.a)x.classList.add('ok');else if(j===k)x.classList.add('no');});
      $('#cm').innerHTML=ok?'<span class="ok-t">정답입니다.</span>':'<span class="no-t">다시 확인해 보세요.</span> 초록색이 정답입니다.';
    });
    $('#pv').onclick=()=>{i--;draw();scrollTop();};
    $('#nx').onclick=()=>{if(i<CONCEPTS.length-1){i++;draw();scrollTop();}else{const m=CONCEPTS.filter(c=>c.check).length;setBest('concept',got,m);result('STEP 01 · 개념 노트',got,m,'개념 확인 문제 '+got+' / '+m,concept);}};
  };
  draw();scrollTop();
}

  `<div class="stages">${Object.entries(TRAIN).map(([k,s],i)=>{const b=prog.best['train_'+k];return `

  <p class="hintline" style="margin-top:10px">대소문자와 마침표·쉼표는 채점에 영향을 주지 않습니다. 철자는 정확하게 써 주세요.</p>`;
  scrollTop();
}
function train(key){
  const set=TRAIN[key];const items=set.items;let i=0,score=0;
  const draw=()=>{
    const it=items[i];let checked=false;
    app.innerHTML=head('STEP 02 · '+set.name,'문항 '+(i+1),`<span class="stat">정답 <b>${score}</b></span><span class="stat"><b>${i+1}</b> / ${items.length}</span>`)+
    `<div class="track"><div style="width:${i/items.length*100}%"></div></div>
    <div class="card"><div class="qno">Q${i+1}</div><div class="qtext">${esc(it.p)}</div>
    <div class="qbox">${esc(it.src)}</div>
    ${it.f.map((f,j)=>`<div class="fld"><label>${esc(f.l)}</label><div class="row"><input data-j="${j}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="여기에 입력">${f.post?`<span class="fix">${esc(f.post)}</span>`:''}</div></div>`).join('')}
    ${it.h?`<div id="hb"></div>`:''}
    <div id="fb"></div>
    <div class="acts">${it.h?'<button class="btn btn-sec" id="hint">힌트: 3단계 공식</button>':'<span></span>'}<div class="r"><button class="btn btn-pri" id="sub">채점</button></div></div></div>`;
    const ins=$$('.card input');ins[0].focus();
    ins.forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')$('#sub').click();}));
    if(it.h)$('#hint').onclick=()=>{$('#hb').innerHTML=`<div class="hintbox">${HINT_PC}</div>`;};
    $('#sub').onclick=()=>{
      if(checked){ if(i<items.length-1){i++;draw();scrollTop();} else {setBest('train_'+key,score,items.length);result('STEP 02 · '+set.name,score,items.length,null,()=>train(key));} return; }
      if(ins.some(x=>!x.value.trim())){toast('빈칸을 모두 채워 주세요');return;}
      checked=true;let ok=true;
      ins.forEach((x,j)=>{const g=checkField(it.f[j],x.value);x.classList.add(g?'ok':'no');x.disabled=true;if(!g)ok=false;});
      if(ok)score++;
      $('#fb').innerHTML=`<div class="fb ${ok?'good':'bad'}"><div class="h">${ok?'정답':'오답'}</div>모범답안: <span class="a">${it.f.map(f=>esc(fieldAns(f))).join(' / ')}</span><div class="exp">${esc(it.e)}</div></div>`;
      $('#sub').textContent=i<items.length-1?'다음 문항':'결과 보기';
    };
  };
  draw();scrollTop();
}

function ingGame(){
  const qs=shuffle(ING).slice(0,14);let i=0,score=0,run=0;
  const draw=()=>{
    const [s,t]=qs[i];
    app.innerHTML=head('STEP 03 · -ing 판별','밑줄 친 -ing의 정체는?',`<span class="stat">정답 <b>${score}</b></span><span class="stat"><b>${i+1}</b> / ${qs.length}</span>`)+
    `<div class="track"><div style="width:${i/qs.length*100}%"></div></div>
    <div class="card"><div class="sent">${s}</div>
    <div class="choices c3">${Object.entries(ING_NAME).map(([k,v])=>`<button class="ch" data-t="${k}">${v}<small>${k==='g'?'명사 역할':k==='p'?'형용사 역할':'부사 역할'}</small></button>`).join('')}</div>
    <div id="fb"></div></div>`;
    $$('.ch').forEach(b=>b.onclick=()=>{
      const ok=b.dataset.t===t;
      $$('.ch').forEach(x=>{x.disabled=true;if(x.dataset.t===t)x.classList.add('correct');else if(x===b)x.classList.add('wrong');});
      if(ok){score++;run++;streak(run);}else run=0;
      $('#fb').innerHTML=`<div class="fb ${ok?'good':'bad'}"><div class="h">${ok?'정답':'오답'} · ${ING_NAME[t]}</div><div class="exp">${ING_WHY[t]}</div></div>
      <div class="acts"><span></span><div class="r"><button class="btn btn-pri" id="nx">${i===qs.length-1?'결과 보기':'다음'}</button></div></div>`;
      $('#nx').onclick=()=>{if(i<qs.length-1){i++;draw();}else{setBest('ing',score,qs.length);result('STEP 03 · -ing 판별',score,qs.length,null,ingGame);}};
    });
  };
  draw();scrollTop();
}

   <tr><td>이유</td><td>~ 때문에</td><td>because로 바꿔도 자연스러움</td></tr>
   <tr><td>시간</td><td>~할 때</td><td>when / while로 바꿔도 자연스러움</td></tr>
   <tr><td>양태</td><td>~하듯이, ~대로</td><td>say · tell · predict · plan · advise</td></tr>
   <tr><td>전치사</td><td>~로서</td><td>as 뒤에 명사만 옴</td></tr></table></div>
   <p class="hintline">정답 +10점, 연속 정답 보너스. 틀린 문장은 끝난 뒤 해설과 함께 보여 드립니다.</p>
   <div class="acts"><span class="stat">최고 기록 <b>${b?b.score+' / '+b.max:'-'}</b></span><div class="r"><button class="btn btn-pri" id="go">시작</button></div></div></div>`;
  $('#go').onclick=asPlay;scrollTop();
}
function asPlay(){
  let left=60,score=0,right=0,total=0,run=0,cur=null,alive=true;const missed=[];
  let pool=shuffle(AS_SENT);
  app.innerHTML=head('STEP 04 · as 분류 스피드','밑줄 친 as의 쓰임은?',`<span class="stat">점수 <b id="sc">0</b></span><span class="stat">정답 <b id="rt">0</b></span>`)+
  `<div class="speed-top"><div class="timebar" id="tb"><div style="width:100%"></div></div><div class="tnum" id="tn">60s</div></div>
   <div class="card speed-card" id="sc-card"><div class="sent" id="sent"></div>
   <div class="choices c5">${AS_TYPES.map(([k,v,h])=>`<button class="ch" data-t="${k}">${v}<small>${h}</small></button>`).join('')}</div>
   <div class="last" id="last"></div></div>`;
  const next=()=>{if(!pool.length)pool=shuffle(AS_SENT);cur=pool.pop();$('#sent').innerHTML=cur[0];};
  $$('.ch').forEach(b=>b.onclick=()=>{
    if(!alive)return;total++;
    const ok=b.dataset.t===cur[1];const card=$('#sc-card');
    card.classList.remove('flash-ok','flash-no');void card.offsetWidth;card.classList.add(ok?'flash-ok':'flash-no');
    const name=AS_TYPES.find(x=>x[0]===cur[1])[1];
    if(ok){right++;run++;score+=10+Math.min(run-1,5)*2;$('#last').innerHTML=`<span class="ok-t">정답</span> · ${name}`;streak(run);}
    else{run=0;missed.push(cur);$('#last').innerHTML=`<span class="no-t">오답</span> · 정답은 <b>${name}</b>`;}
    $('#sc').textContent=score;$('#rt').textContent=right+' / '+total;
    next();
  });
  next();
  const t=setInterval(()=>{
    if(!document.getElementById('tn')){clearInterval(t);alive=false;return;}
    left--;$('#tn').textContent=left+'s';$('#tb div').style.width=(left/60*100)+'%';if(left<=10)$('#tb').classList.add('warn');
    if(left<=0){clearInterval(t);alive=false;setBest('as',right,Math.max(total,1));
      const rev=missed.length?`<div class="review" style="text-align:left">${missed.map(m=>`<div>${m[0].replace(/<\/?mark>/g,'')}<span>${AS_TYPES.find(x=>x[0]===m[1])[1]}</span></div>`).join('')}</div>`:'';
      result('STEP 04 · as 분류 스피드',right,Math.max(total,1),score+'점 · 정답률 '+Math.round(right/Math.max(total,1)*100)+'%',asPlay,rev);}
  },1000);
  scrollTop();
}

/* =========================================================
   05 문장 조립
   ========================================================= */
function blockGame(){
  const qs=shuffle(BLOCKS).slice(0,8);let i=0,score=0;
  const draw=()=>{
    const q=qs[i];
    const words=q.s.replace(/[,.]/g,'').split(' ');
    const pool=shuffle(words.map((w,k)=>({w,k})));
    let picked=[],checked=false;
    const paint=()=>{
      app.innerHTML=head('STEP 05 · 문장 조립','우리말에 맞게 배열하세요',`<span class="stat">정답 <b>${score}</b></span><span class="stat"><b>${i+1}</b> / ${qs.length}</span>`)+
      `<div class="track"><div style="width:${i/qs.length*100}%"></div></div>
      <div class="card"><div class="qtext">${esc(q.k)}</div>
      <div class="zone" id="z">${picked.length?picked.map((p,j)=>`<button class="blk" data-j="${j}">${esc(p.w)}</button>`).join(''):'<span class="ph">아래 단어를 순서대로 눌러 주세요. 놓은 단어를 누르면 빠집니다.</span>'}</div>
      <div class="pool">${pool.map(p=>`<button class="blk ${picked.includes(p)?'used':''}" data-k="${p.k}">${esc(p.w)}</button>`).join('')}</div>
      <div id="fb"></div>
      <div class="acts"><button class="btn btn-sec" id="rs">처음부터</button><div class="r"><button class="btn btn-pri" id="ck" ${picked.length===words.length||checked?'':'disabled'}>${checked?(i<qs.length-1?'다음':'결과 보기'):'확인'}</button></div></div></div>`;
      $$('.pool .blk').forEach(b=>b.onclick=()=>{if(checked)return;const p=pool.find(x=>x.k==b.dataset.k);if(!picked.includes(p)){picked.push(p);paint();}});
      $$('#z .blk').forEach(b=>b.onclick=()=>{if(checked)return;picked.splice(+b.dataset.j,1);paint();});
      $('#rs').onclick=()=>{if(checked)return;picked=[];paint();};
      $('#ck').onclick=()=>{
        if(checked){if(i<qs.length-1){i++;draw();}else{setBest('block',score,qs.length);result('STEP 05 · 문장 조립',score,qs.length,null,blockGame);}return;}
        checked=true;const ok=picked.map(p=>p.w).join(' ')===words.join(' ');if(ok)score++;
        paint();
        $('#fb').innerHTML=`<div class="fb ${ok?'good':'bad'}"><div class="h">${ok?'정답':'순서가 다릅니다'}</div><span class="a">${esc(q.s)}</span></div>`;
      };
    };
    paint();
  };
  draw();scrollTop();
}

/* =========================================================
   06 실전 50제
   ========================================================= */
let examSec='ALL';
function exam(startIdx){
  const list=EXAM.filter(q=>examSec==='ALL'||secOf(q.n)===examSec);
  let idx=startIdx;
  if(idx===undefined){const u=list.findIndex(q=>!prog.exam[q.n]);idx=u>=0?u:0;}
  examDraw(list,idx,'exam');
}
function examWrong(){const list=EXAM.filter(q=>prog.wrong.includes(q.n));if(list.length)examDraw(list,0,'wrong');}
function examDraw(list,idx,mode){
  const q=list[idx];const isMC=!q.f;
  const ok=Object.values(prog.exam).filter(v=>v==='ok').length,done=Object.keys(prog.exam).length;
  app.innerHTML=head(mode==='wrong'?'오답노트':'STEP 06 · 실전 50제',mode==='wrong'?'틀린 문항 다시 풀기':SECS[secOf(q.n)],`<span class="stat">정답 <b>${ok}</b> / 50</span><span class="stat">풀이 <b>${done}</b></span>`)+
  (mode==='exam'?`<div class="filters">${[['ALL','전체'],...Object.entries(SECS)].map(([k,v])=>`<button class="${examSec===k?'on':''}" data-s="${k}">${v}</button>`).join('')}</div>`:'')+
  `<div class="grid">${list.map((x,j)=>`<button class="${prog.exam[x.n]||''} ${j===idx?'cur':''}" data-j="${j}">${x.n}</button>`).join('')}</div>
  <div class="card">
   <div class="qno">${String(q.n).padStart(2,'0')} <span class="tag">${isMC?'객관식':'서술형'}</span>${q.tag&&q.tag!=='서술형'?`<span class="tag gold">${q.tag}</span>`:''}</div>
   <div class="qtext">${esc(q.q)}</div>
   ${q.box?`<div class="qbox">${rich(q.box)}</div>`:''}
   ${isMC?`<div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="m">${MARK[k]}</span><span>${rich(o)}</span></button>`).join('')}</div>`:
     q.f.map((f,j)=>`<div class="fld"><label>${esc(f.l)}</label><div class="row"><input data-j="${j}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${f.self?'생각을 적어 보고 모범답안과 비교하세요':'답을 입력하세요'}"></div></div>`).join('')+'<p class="hintline">대소문자·문장부호는 채점에 영향을 주지 않습니다. (스스로 확인) 칸은 채점하지 않습니다.</p>'}
   <div id="fb"></div>
   <div class="acts"><button class="btn btn-sec" id="pv" ${idx?'':'disabled'}>이전</button><div class="r"><button class="btn btn-pri" id="sub">채점</button></div></div>
  </div>`;
  $$('.filters button').forEach(b=>b.onclick=()=>{examSec=b.dataset.s;exam();});
  $$('.grid button').forEach(b=>b.onclick=()=>examDraw(list,+b.dataset.j,mode));
  $('#pv').onclick=()=>examDraw(list,idx-1,mode);
  let sel=null,checked=false;
  $$('.opt').forEach(b=>b.onclick=()=>{if(checked)return;sel=+b.dataset.k;$$('.opt').forEach(x=>x.classList.toggle('sel',+x.dataset.k===sel));});
  const ins=$$('.card input');ins.forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')$('#sub').click();}));
  $('#sub').onclick=()=>{
    if(checked){
      if(idx<list.length-1)examDraw(list,idx+1,mode);
      else{const o2=Object.values(prog.exam).filter(v=>v==='ok').length;result(mode==='wrong'?'오답노트':'STEP 06 · 실전 50제',o2,50,'실전 50제 누적 정답',()=>exam(0),`<div class="pill">남은 오답 ${prog.wrong.length}문항</div>`);}
      return;
    }
    let good;
    if(isMC){
      if(sel===null){toast('답을 골라 주세요');return;}
      good=sel===q.a;
      $$('.opt').forEach(x=>{const k=+x.dataset.k;x.disabled=true;x.classList.remove('sel');if(k===q.a)x.classList.add('correct');else if(k===sel)x.classList.add('wrong');});
    }else{
      const need=ins.filter((x,j)=>!q.f[j].self);
      if(need.some(x=>!x.value.trim())){toast('답을 입력해 주세요');return;}
      good=true;
      ins.forEach((x,j)=>{const r=checkField(q.f[j],x.value);x.disabled=true;if(r===null)x.classList.add('self');else{x.classList.add(r?'ok':'no');if(!r)good=false;}});
    }
    checked=true;
    prog.exam[q.n]=good?'ok':'no';
    if(good)prog.wrong=prog.wrong.filter(n=>n!==q.n);else if(!prog.wrong.includes(q.n))prog.wrong.push(q.n);
    save();
    const ans=isMC?`${MARK[q.a]} ${esc(plain(q.o[q.a])).replace(/\n/g,' / ')}`:q.f.filter(f=>!f.self).map(f=>(q.f.length>1?esc(f.l)+' ':'')+esc(fieldAns(f))).join('<br>');
    const selfs=isMC?'':q.f.filter(f=>f.self).map(f=>`<div class="self"><b>${esc(f.l.replace(' (스스로 확인)',''))} 모범답안</b><br>${esc(f.self)}</div>`).join('');
    $('#fb').innerHTML=`<div class="fb ${good?'good':'bad'}"><div class="h">${good?'정답':'오답 · 오답노트에 저장했습니다'}</div>정답: <span class="a">${ans}</span><div class="exp">${esc(q.e)}</div>${selfs}</div>`;
    $('#sub').textContent=idx<list.length-1?'다음 문항':'결과 보기';
    const gb=app.querySelector(`.grid button[data-j="${idx}"]`);if(gb){gb.classList.remove('ok','no');gb.classList.add(good?'ok':'no');}
  };
  scrollTop();
}

home();
</script>
